# Render manifest for AxiomVault
#
# One Docker web service runs everything: entrypoint.sh applies migrations, starts
# the Celery worker in the background, then starts Gunicorn. There is no separate
# worker service.
#
# Values marked `sync: false` are secrets or per-deployment settings: Render asks
# for them when the Blueprint is created, or set them on the service's
# Environment page. Never put real values in this file.

services:
  - type: web
    name: axiomvault-web
    runtime: docker
    plan: starter
    dockerfilePath: Dockerfile
    healthCheckPath: /api/docs/
    envVars:
      - key: ENV
        value: prod
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      # Neon Postgres: the direct (non-pooled) connection string, ending in ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: axiomvault-redis
          property: connectionString
      # Frontend origins allowed to call the API, comma-separated.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Brevo SMTP (or any SMTP provider).
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_SSL
        value: "False"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Django admin account created on first boot (used for /admin/ only).
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  - type: keyvalue
    name: axiomvault-redis
    plan: starter
    # Never evict: queued email jobs must not be dropped when memory is full.
    maxmemoryPolicy: noeviction
    ipAllowList: []

# The database is hosted on Neon, not Render, so no `databases:` block.
