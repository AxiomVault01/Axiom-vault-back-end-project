# Sample Render manifest for AxiomVault
# Adjust names, plans, and secrets as needed in the Render dashboard

services:
  - type: web
    name: axiomvault-web
    env: docker
    plan: starter
    dockerfilePath: Dockerfile
    buildCommand: ''
    startCommand: ./entrypoint.sh
    envVars:
      - key: ENV
        value: prod
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        fromSecret: SECRET_KEY
      - key: DATABASE_URL
        fromSecret: DATABASE_URL
      - key: REDIS_URL
        fromSecret: REDIS_URL
      - key: EMAIL_HOST_USER
        value: onukwupetrusoge@gmail.com
      - key: EMAIL_HOST_PASSWORD
        fromSecret: EMAIL_HOST_PASSWORD
      - key: DEFAULT_FROM_EMAIL
        value: onukwupetrusoge@gmail.com
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com
      - key: DJANGO_SUPERUSER_PASSWORD
        fromSecret: DJANGO_SUPERUSER_PASSWORD

  - type: worker
    name: axiomvault-worker
    env: docker
    plan: starter
    dockerfilePath: Dockerfile
    startCommand: ./celery-entrypoint.sh celery -A config.celery worker -l info
    envVars:
      - key: ENV
        value: prod
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        fromSecret: SECRET_KEY
      - key: DATABASE_URL
        fromSecret: DATABASE_URL
      - key: REDIS_URL
        fromSecret: REDIS_URL
      - key: EMAIL_HOST_USER
        value: onukwupetrusoge@gmail.com
      - key: EMAIL_HOST_PASSWORD
        fromSecret: EMAIL_HOST_PASSWORD
      - key: DEFAULT_FROM_EMAIL
        value: onukwupetrusoge@gmail.com
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com
      - key: DJANGO_SUPERUSER_PASSWORD
        fromSecret: DJANGO_SUPERUSER_PASSWORD

databases:
  - name: axiomvault-db
    plan: starter
    engine: postgres
    version: "15"

addons:
  - type: redis
    name: axiomvault-redis
    plan: starter

# Notes:
# - After creating the managed Postgres and Redis instances on Render, set
#   `DATABASE_URL` and `REDIS_URL` values in the Render dashboard or create
#   secrets for them and reference them via `fromSecret`.
# - Ensure secrets (SECRET_KEY, EMAIL_HOST_PASSWORD, DJANGO_SUPERUSER_PASSWORD)
#   are created on Render and referenced in this manifest.
